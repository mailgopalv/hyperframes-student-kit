    <script>
      (function () {
        const D = 248.2;
        const sel = (s) => '[data-composition-id="agent-evolution"] ' + s;
        const N = {
          user: [260, 540], agent: [820, 400], llm: [820, 660],
          order: [1480, 260], product: [1480, 470], payment: [1480, 680],
        };
        const TEAL = '#37bdf8', RED = '#e10b1f', AMBER = '#f5a623';

        // Precompute connector lengths for dash-draw (deterministic DOM read).
        const lineIds = ['line-user-agent', 'line-agent-llm', 'line-agent-order', 'line-agent-product', 'line-agent-payment'];
        const lens = {};
        lineIds.forEach(function (id) {
          const el = document.querySelector(sel('#' + id));
          const len = el.getTotalLength();
          lens[id] = len;
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
        });

        const tl = gsap.timeline({ paused: true });

        function drawLine(id, t, dur) {
          tl.to(sel('#' + id), { opacity: 1, duration: 0.1 }, t);
          tl.to(sel('#' + id), { strokeDashoffset: 0, duration: dur || 0.5, ease: 'power2.out' }, t);
        }

        function hop(t, from, to, color, dur) {
          dur = dur || 0.5;
          tl.set(sel('#pulse'), { x: N[from][0] - 9, y: N[from][1] - 9, opacity: 1, backgroundColor: color, boxShadow: '0 0 16px ' + color }, t);
          tl.to(sel('#pulse'), { x: N[to][0] - 9, y: N[to][1] - 9, duration: dur, ease: 'power1.inOut' }, t);
          tl.to(sel('#node-' + to), { boxShadow: '0 0 34px ' + color, duration: 0.2, ease: 'power2.out' }, t + dur);
          tl.to(sel('#node-' + to), { boxShadow: '0 0 20px rgba(55,189,248,0.15)', duration: 0.4, ease: 'power2.in' }, t + dur + 0.22);
          tl.to(sel('#pulse'), { opacity: 0, duration: 0.25 }, t + dur + 0.3);
        }

        function show(id, t) { tl.to(sel('#' + id), { opacity: 1, y: 0, duration: 0.32, ease: 'power2.out' }, t); }
        function hide(id, t) { tl.to(sel('#' + id), { opacity: 0, y: -8, duration: 0.26, ease: 'power2.in' }, t); }

        function revealAPI(key, lineId, t) {
          const nodeSel = sel('#node-' + key);
          tl.fromTo(nodeSel, { opacity: 0, x: 40, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: 'back.out(1.4)' }, t);
          tl.fromTo(nodeSel, { borderColor: AMBER, boxShadow: '0 0 32px rgba(245,166,35,0.6)' }, { borderColor: 'rgba(55,189,248,0.4)', boxShadow: '0 0 20px rgba(55,189,248,0.15)', duration: 1.0, ease: 'power2.out' }, t + 0.3);
          drawLine(lineId, t + 0.15, 0.6);
        }

        // --- Title card ---
        tl.from(sel('.tc-kicker'), { opacity: 0, y: -14, duration: 0.5, ease: 'power2.out' }, 0.2);
        tl.from(sel('.tc-title'), { opacity: 0, y: 20, duration: 0.6, ease: 'power3.out' }, 0.35);
        tl.to(sel('.title-card'), { y: -60, filter: 'blur(24px)', opacity: 0, duration: 0.55, ease: 'power2.in' }, 4.0);
        tl.set(sel('.title-card'), { display: 'none' }, 4.6);

        // --- Diagram construction (v1: agent + LLM, no API yet) ---
        tl.from(sel('#ae-kicker'), { opacity: 0, y: -10, duration: 0.4, ease: 'power2.out' }, 4.2);
        tl.to(sel('#hdr-v1'), { opacity: 1, duration: 0.4, ease: 'power2.out' }, 4.2);
        tl.fromTo(sel('#node-agent'), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.4)' }, 4.5);
        tl.fromTo(sel('#node-llm'), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.4)' }, 4.8);
        drawLine('line-agent-llm', 5.0, 0.5);
        tl.fromTo(sel('#node-user'), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 5.3);
        drawLine('line-user-agent', 5.6, 0.6);

        // Establishing pulse — generic wiring, no dialogue yet.
        hop(8.0, 'user', 'agent', TEAL, 0.9);
        hop(10.0, 'agent', 'llm', TEAL, 0.7);

        // Concrete failing example — no order API yet.
        show('b-q1', 12.0);
        hop(12.6, 'user', 'agent', TEAL, 0.7);
        hop(13.6, 'agent', 'llm', TEAL, 0.6);
        tl.to(sel('#node-llm'), { boxShadow: '0 0 34px ' + RED, duration: 0.3 }, 15.8);
        tl.to(sel('#node-llm'), { boxShadow: '0 0 20px rgba(55,189,248,0.15)', duration: 0.5 }, 16.4);
        hop(16.6, 'llm', 'agent', RED, 0.6);
        hop(17.4, 'agent', 'user', RED, 0.7);
        hide('b-q1', 19.6);
        show('b-f1', 20.0);

        // --- Add Order Management API ---
        hide('b-f1', 32.4);
        revealAPI('order', 'line-agent-order', 33.0);
        show('snip-order', 38.5);
        hide('snip-order', 44.5);

        // --- Success flow: order status, spread across the narrated walk-through ---
        show('b-q2', 64.0);
        hop(64.6, 'user', 'agent', TEAL, 0.8);
        hop(73.6, 'agent', 'llm', TEAL, 0.7);
        hop(84.9, 'llm', 'agent', TEAL, 0.7);
        tl.to(sel('#node-order'), { boxShadow: '0 0 34px ' + AMBER, duration: 0.25 }, 91.8);
        hop(92.0, 'agent', 'order', AMBER, 0.7);
        hop(95.6, 'order', 'agent', TEAL, 0.7);
        hop(101.3, 'agent', 'llm', TEAL, 0.6);
        hop(102.7, 'llm', 'agent', TEAL, 0.6);
        hop(103.5, 'agent', 'user', TEAL, 0.7);
        hide('b-q2', 104.6);
        show('b-a2', 105.0);

        // --- Failing example #2: product query, still only order API ---
        hide('b-a2', 115.3);
        show('b-q3', 115.5);
        hop(116.0, 'user', 'agent', TEAL, 0.7);
        hop(117.0, 'agent', 'llm', TEAL, 0.6);
        tl.to(sel('#node-llm'), { boxShadow: '0 0 34px ' + RED, duration: 0.3 }, 119.6);
        tl.to(sel('#node-llm'), { boxShadow: '0 0 20px rgba(55,189,248,0.15)', duration: 0.5 }, 120.2);
        hop(120.4, 'llm', 'agent', RED, 0.6);
        hop(121.2, 'agent', 'user', RED, 0.7);
        hide('b-q3', 123.6);
        show('b-f2', 124.0);

        // --- Add Product Management API (now v2) ---
        hide('b-f2', 145.6);
        tl.to(sel('#hdr-v1'), { opacity: 0, duration: 0.3 }, 146.0);
        tl.to(sel('#hdr-v2'), { opacity: 1, duration: 0.4 }, 146.2);
        revealAPI('product', 'line-agent-product', 146.5);
        show('snip-product', 151.0);
        hide('snip-product', 157.0);

        // --- Success flow: product search ---
        show('b-q4', 177.2);
        hop(177.8, 'user', 'agent', TEAL, 0.6);
        hop(180.0, 'agent', 'llm', TEAL, 0.6);
        hop(183.0, 'llm', 'agent', TEAL, 0.6);
        tl.to(sel('#node-product'), { boxShadow: '0 0 34px ' + AMBER, duration: 0.25 }, 185.8);
        hop(186.0, 'agent', 'product', AMBER, 0.6);
        hop(189.0, 'product', 'agent', TEAL, 0.6);
        hop(192.0, 'agent', 'llm', TEAL, 0.5);
        hop(193.6, 'llm', 'agent', TEAL, 0.5);
        hop(194.4, 'agent', 'user', TEAL, 0.6);
        hide('b-q4', 196.6);
        show('b-a3', 197.0);

        // --- Failing example #3: refund, still no payment API ---
        hide('b-a3', 202.6);
        show('b-q5', 203.0);
        hop(203.5, 'user', 'agent', TEAL, 0.6);
        hop(204.6, 'agent', 'llm', TEAL, 0.5);
        tl.to(sel('#node-llm'), { boxShadow: '0 0 34px ' + RED, duration: 0.3 }, 206.6);
        tl.to(sel('#node-llm'), { boxShadow: '0 0 20px rgba(55,189,248,0.15)', duration: 0.5 }, 207.2);
        hop(207.4, 'llm', 'agent', RED, 0.5);
        hop(208.1, 'agent', 'user', RED, 0.6);
        hide('b-q5', 210.6);
        show('b-f3', 211.0);

        // --- Add Payment & Refund API (now v3) ---
        hide('b-f3', 217.0);
        tl.to(sel('#hdr-v2'), { opacity: 0, duration: 0.3 }, 217.3);
        tl.to(sel('#hdr-v3'), { opacity: 1, duration: 0.4 }, 217.5);
        revealAPI('payment', 'line-agent-payment', 217.8);
        show('snip-payment', 221.0);
        hide('snip-payment', 228.0);

        // --- Final success: full round trip closes the loop ---
        show('b-q6', 237.8);
        hop(238.2, 'user', 'agent', TEAL, 0.4);
        hop(238.7, 'agent', 'llm', TEAL, 0.35);
        hop(239.1, 'llm', 'agent', TEAL, 0.35);
        tl.to(sel('#node-payment'), { boxShadow: '0 0 34px ' + AMBER, duration: 0.2 }, 239.4);
        hop(239.5, 'agent', 'payment', AMBER, 0.4);
        hop(239.95, 'payment', 'agent', TEAL, 0.4);
        hop(240.4, 'agent', 'llm', TEAL, 0.3);
        hop(240.75, 'llm', 'agent', TEAL, 0.3);
        hop(241.1, 'agent', 'user', TEAL, 0.4);
        hide('b-q6', 240.9);
        show('b-a4', 241.4);

        // Camera settles back to reveal the complete, working v3 system.
        tl.to(sel('.ae-wrap'), { scale: 0.97, transformOrigin: '50% 50%', duration: 1.2, ease: 'power2.inOut' }, 244.0);
        tl.to(sel('.ae-wrap'), { y: -4, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 245.0);

        tl.set({}, {}, D);
        window.__timelines = window.__timelines || {};
        window.__timelines['agent-evolution'] = tl;
      })();
