    <script>
      (function () {
        const S = '[data-composition-id="ch6"] ';
        const q = (sel) => document.querySelector(S + sel);
        const qa = (sel) => document.querySelectorAll(S + sel);
        const DURATION = 113.5;
        const tl = gsap.timeline({ paused: true });
        const boxes = { root: "#g-root", cat: "#g-cat", cart: "#g-cart", ord: "#g-ord" };
        gsap.set(Object.values(boxes).map(q), { xPercent: -50, yPercent: -50 });
        qa(".m").forEach((m) => gsap.set(m, { opacity: 0 }));
        qa(".grp .st, .grp .c").forEach((c) => gsap.set(c, { opacity: 0 }));

        // ---------- helpers ----------
        const control = (key, t) => Object.entries(boxes).forEach(([k, id]) => {
          const on = k === key;
          tl.to(q(id), { opacity: on ? 1 : 0.35, borderColor: on ? "#ffffff" : "rgba(55,189,248,0.5)", boxShadow: on ? "0 0 44px rgba(255,255,255,0.45)" : "0 0 0px rgba(255,255,255,0)", duration: 0.4, ease: "power2.out" }, t);
          tl.to(q(id + " .ctl"), { opacity: on ? 1 : 0, duration: 0.3, ease: "power2.out" }, t);
        });
        // path points sampled once at build time (no DOM measurement inside tween callbacks)
        const sample = (id) => { const p = q(id); const len = p.getTotalLength(); const out = [];
          for (let i = 0; i <= 80; i++) { const pt = p.getPointAtLength(len * i / 80); out.push([pt.x, pt.y]); } return out; };
        const travel = (pathId, t, dur, reverse) => {
          let pts = sample(pathId); if (reverse) pts = pts.slice().reverse();
          tl.set(q("#pulse"), { opacity: 1, x: pts[0][0], y: pts[0][1] }, t);
          tl.to(q("#pulse"), { keyframes: { x: pts.map((p) => p[0]), y: pts.map((p) => p[1]), easeEach: "none" }, duration: dur, ease: "power2.inOut" }, t);
          tl.set(q("#pulse"), { opacity: 0 }, t + dur + 0.05);
        };
        let prevGroup = null;
        const group = (id, t) => {
          if (prevGroup) tl.to(q(prevGroup), { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, t - 0.3);
          tl.fromTo(q(id), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.01, ease: "none" }, t);
          tl.fromTo(q(id + " .st"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, t);
