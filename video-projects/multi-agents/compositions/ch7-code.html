<div class="ln"><span class="no">52</span><span class="tx">    instruction=<span class="str">"""</span></span></div>
<div class="ln"><span class="no">53</span><span class="tx"><span class="str">    You manage the shopping cart for <span class="ph">{user_name<span class="q">?</span>}</span>.</span></span></div>
<div class="ln"><span class="no">54</span><span class="tx"><span class="str">    - Start by using view_cart to show the items and the total.</span></span></div>
<div class="ln"><span class="no">55</span><span class="tx"><span class="str">    - Use add_to_cart or remove_from_cart when the customer asks for changes.</span></span></div>
<div class="ln"><span class="no">56</span><span class="tx"><span class="str">    - If the customer wants to browse more products, transfer to catalog_agent.</span></span></div>
<div class="ln"><span class="no">57</span><span class="tx"><span class="str">    - When the customer is happy, use confirm_cart, then transfer to order_agent.</span></span></div>
<div class="ln"><span class="no">58</span><span class="tx"><span class="str">    """</span>,</span></div>
<div class="ln"><span class="no">59</span><span class="tx">    tools=[view_cart, add_to_cart, remove_from_cart, confirm_cart],</span></div>
<div class="ln"><span class="no">60</span><span class="tx">)</span></div>
</div></div>
<div class="view code-view" id="v-ord" data-n="42"><div class="scroller" id="sc-ord"><div class="band a" id="ba-ord"></div><div class="band b" id="bb-ord"></div>
<div class="ln"><span class="no">1</span><span class="tx"><span class="str">"""Sub-agent 3: confirms the details and places the order."""</span></span></div>
<div class="ln"><span class="no">2</span><span class="tx"></span></div>
<div class="ln"><span class="no">3</span><span class="tx"><span class="kw">import</span> os</span></div>
<div class="ln"><span class="no">4</span><span class="tx"><span class="kw">import</span> uuid</span></div>
<div class="ln"><span class="no">5</span><span class="tx"></span></div>
<div class="ln"><span class="no">6</span><span class="tx"><span class="kw">from</span> google.adk.agents <span class="kw">import</span> Agent</span></div>
<div class="ln"><span class="no">7</span><span class="tx"><span class="kw">from</span> google.adk.tools <span class="kw">import</span> ToolContext</span></div>
<div class="ln"><span class="no">8</span><span class="tx"></span></div>
<div class="ln"><span class="no">9</span><span class="tx"><span class="kw">from</span> .cart_agent <span class="kw">import</span> view_cart</span></div>
<div class="ln"><span class="no">10</span><span class="tx"></span></div>
<div class="ln"><span class="no">11</span><span class="tx">MODEL = os.getenv(<span class="str">"GEMINI_MODEL"</span>, <span class="str">"gemini-2.5-flash"</span>)</span></div>
<div class="ln"><span class="no">12</span><span class="tx"></span></div>
<div class="ln"><span class="no">13</span><span class="tx"></span></div>
<div class="ln"><span class="no">14</span><span class="tx"><span class="kw">def</span> place_order(tool_context: ToolContext) -&gt; dict:</span></div>
<div class="ln"><span class="no">15</span><span class="tx">    <span class="str">"""Places the order for everything in the confirmed cart."""</span></span></div>
<div class="ln"><span class="no">16</span><span class="tx">    <span class="kw">if</span> <span class="kw">not</span> tool_context.state.get(<span class="str">"cart_confirmed"</span>):</span></div>
<div class="ln"><span class="no">17</span><span class="tx">        <span class="kw">return</span> {<span class="str">"error"</span>: <span class="str">"Please confirm the cart first"</span>}</span></div>
<div class="ln"><span class="no">18</span><span class="tx">    summary = view_cart(tool_context)</span></div>
<div class="ln"><span class="no">19</span><span class="tx"></span></div>
<div class="ln"><span class="no">20</span><span class="tx">    order_id = <span class="str">"ORD-"</span> + uuid.uuid4().hex[:6].upper()</span></div>
<div class="ln"><span class="no">21</span><span class="tx">    tool_context.state[<span class="str">"order_id"</span>] = order_id</span></div>
<div class="ln"><span class="no">22</span><span class="tx">    tool_context.state[<span class="str">"order_status"</span>] = <span class="str">"placed"</span></span></div>
<div class="ln"><span class="no">23</span><span class="tx">    <span class="kw">return</span> {</span></div>
<div class="ln"><span class="no">24</span><span class="tx">        <span class="str">"order_id"</span>: order_id,</span></div>
<div class="ln"><span class="no">25</span><span class="tx">        <span class="str">"items"</span>: summary[<span class="str">"items"</span>],</span></div>
<div class="ln"><span class="no">26</span><span class="tx">        <span class="str">"total"</span>: summary[<span class="str">"total"</span>],</span></div>
<div class="ln"><span class="no">27</span><span class="tx">        <span class="str">"email"</span>: tool_context.state.get(<span class="str">"user_email"</span>),</span></div>
<div class="ln"><span class="no">28</span><span class="tx">    }</span></div>
<div class="ln"><span class="no">29</span><span class="tx"></span></div>
<div class="ln"><span class="no">30</span><span class="tx"></span></div>
<div class="ln"><span class="no">31</span><span class="tx">order_agent = Agent(</span></div>
<div class="ln"><span class="no">32</span><span class="tx">    name=<span class="str">"order_agent"</span>,</span></div>
<div class="ln"><span class="no">33</span><span class="tx">    model=MODEL,</span></div>
<div class="ln"><span class="no">34</span><span class="tx">    description=<span class="str">"Confirms the customer's details and places the order."</span>,</span></div>
<div class="ln"><span class="no">35</span><span class="tx">    instruction=<span class="str">"""</span></span></div>
<div class="ln"><span class="no">36</span><span class="tx"><span class="str">    You place the order for <span class="ph">{user_name<span class="q">?</span>}</span>.</span></span></div>
<div class="ln"><span class="no">37</span><span class="tx"><span class="str">    - Use view_cart to show the final items. The total is <span class="ph">{cart_total<span class="q">?</span>}</span>.</span></span></div>
<div class="ln"><span class="no">38</span><span class="tx"><span class="str">    - Confirm the delivery details: email <span class="ph">{user_email<span class="q">?</span>}</span>, phone <span class="ph">{user_phone<span class="q">?</span>}</span>.</span></span></div>
<div class="ln"><span class="no">39</span><span class="tx"><span class="str">    - When the customer says yes, use place_order and share the order id.</span></span></div>
<div class="ln"><span class="no">40</span><span class="tx"><span class="str">    """</span>,</span></div>
<div class="ln"><span class="no">41</span><span class="tx">    tools=[view_cart, place_order],</span></div>
<div class="ln"><span class="no">42</span><span class="tx">)</span></div>
</div></div>
