    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const S = '[data-composition-id="ch5"] ';
        const q = (sel) => document.querySelector(S + sel);
        const DURATION = 52;
        const tl = gsap.timeline({ paused: true });
        const boxes = ["#root", "#cat", "#cart", "#ord"];
        gsap.set([...boxes.map(q), q("#msg"), q("#xfer")], { xPercent: -50, yPercent: -50 });

        // "control" = glow + IN CONTROL tag on one box, others dim
        const control = (id, t) => boxes.forEach((b) => {
          const on = b === id;
          tl.to(q(b), { opacity: on ? 1 : 0.35, borderColor: on ? "#ffffff" : "rgba(55,189,248,0.5)", boxShadow: on ? "0 0 50px rgba(255,255,255,0.45)" : "0 0 0px rgba(55,189,248,0)", duration: 0.4, ease: "power2.out" }, t);
          tl.to(q(b + " .ctl"), { opacity: on ? 1 : 0, duration: 0.3, ease: "power2.out" }, t);
        });
        const allOn = (t) => boxes.forEach((b) => {
          tl.to(q(b), { opacity: 1, borderColor: "rgba(55,189,248,0.6)", boxShadow: "0 0 28px rgba(55,189,248,0.22)", duration: 0.5, ease: "power2.out" }, t);
          tl.to(q(b + " .ctl"), { opacity: 0, duration: 0.3, ease: "power2.out" }, t);
        });
        // white hand-off pulse along a motion path (proxy → seek-safe)
        // path points sampled once at build time (no DOM measurement inside tween callbacks)
        const sample = (id) => { const p = q(id); const len = p.getTotalLength(); const out = [];
          for (let i = 0; i <= 80; i++) { const pt = p.getPointAtLength(len * i / 80); out.push([pt.x, pt.y]); } return out; };
        const travel = (pathId, t, dur, reverse) => {
          let pts = sample(pathId); if (reverse) pts = pts.slice().reverse();
          tl.set(q("#pulse"), { opacity: 1, x: pts[0][0], y: pts[0][1] }, t);
          tl.to(q("#pulse"), { keyframes: { x: pts.map((p) => p[0]), y: pts.map((p) => p[1]), easeEach: "none" }, duration: dur, ease: "power2.inOut" }, t);
          tl.set(q("#pulse"), { opacity: 0 }, t + dur + 0.05);
        };

        // cue 5.1 (0.6) — heading + the tree returns
        tl.from(q("#kicker"), { x: -60, opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "expo.out" }, 0.3);
        tl.from(q("#heading"), { y: 60, opacity: 0, filter: "blur(16px)", duration: 0.8, ease: "expo.out" }, 0.5);
        tl.from(q("#root"), { scale: 0.6, opacity: 0, filter: "blur(12px)", duration: 0.7, ease: "back.out(1.5)" }, 1.4);
        ["#ln-a", "#ln-b", "#ln-c"].forEach((id, i) => {
          const p = q(id); const len = p.getTotalLength();
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(p, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 2.0 + i * 0.2);
        });
        tl.from([q("#cat"), q("#cart"), q("#ord")], { y: 50, opacity: 0, scale: 0.7, duration: 0.55, ease: "back.out(1.6)", stagger: 0.2 }, 2.4);
        tl.from([q("#sib-1"), q("#sib-2")], { opacity: 0, duration: 0.5, ease: "power2.out" }, 3.4);

        // cue 5.2 (6.1) — every agent has a description; the LLM reads them to choose
        [["#d-root", 8.0], ["#d-cat", 8.8], ["#d-cart", 9.6], ["#d-ord", 10.4]].forEach(([id, t]) => {
          tl.from(q(id), { opacity: 0, y: 16, filter: "blur(6px)", duration: 0.5, ease: "power3.out" }, t);
        });
        tl.fromTo(q("#msg"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 11.4);
        // scan: each description lights briefly, cart_agent's stays lit (best match)
        ["#d-root", "#d-cat", "#d-cart", "#d-ord"].forEach((id, i) => {
          tl.to(q(id), { color: "#ffffff", borderLeftColor: "#ffffff", duration: 0.2, ease: "none", yoyo: true, repeat: 1 }, 12.4 + i * 0.35);
        });
        tl.to(q("#d-cart"), { color: "#ffffff", borderLeftColor: "#ffffff", duration: 0.3, ease: "power2.out" }, 14.0);
        tl.to(q("#cart"), { borderColor: "#ffffff", boxShadow: "0 0 40px rgba(255,255,255,0.35)", duration: 0.3, ease: "power2.out" }, 14.0);

        // cue 5.3 (15.07) — transfer_to_agent hands control over
        tl.to(q("#msg"), { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, 15.1);
        tl.fromTo(q("#xfer"), { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 15.5);
        control("#root", 16.0);
        travel("#mp-down-cart", 21.2, 0.9);
        control("#cart", 22.05);

        // cue 5.4 (25.7) — only one agent in control at a time
        tl.to(q("#cart .ctl"), { scale: 1.2, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 3 }, 26.6);
        tl.to(q("#d-cart"), { color: "#b9c6d4", borderLeftColor: "rgba(55,189,248,0.6)", duration: 0.4, ease: "power2.out" }, 27.0);

        // cue 5.5 (31.67) — down, sideways, back up
        tl.to(q("#xfer"), { opacity: 0, y: 20, duration: 0.3, ease: "power2.in" }, 31.6);
        control("#root", 32.0);
        travel("#mp-down-cat", 33.3, 1.0);
        tl.fromTo(q("#dir-down"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 33.4);
        control("#cat", 34.3);
        travel("#mp-side", 36.1, 0.7);
        tl.fromTo(q("#dir-side"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 36.1);
        control("#cart", 36.8);
        travel("#mp-up", 38.5, 0.8);
        tl.fromTo(q("#dir-up"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 38.5);
        control("#root", 39.3);

        // cue 5.6 (41.03) — they all share ONE session
        tl.to([q("#dir-down"), q("#dir-side"), q("#dir-up")], { opacity: 0, duration: 0.3, ease: "power2.in" }, 41.0);
        allOn(41.2);
        tl.fromTo(q("#slab"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 41.6);
        ["#lk-root", "#lk-cat", "#lk-cart", "#lk-ord"].forEach((id, i) => {
          tl.fromTo(q(id), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 42.6 + i * 0.2);
        });
        tl.from(q(".sl-part.ev"), { scale: 0.8, opacity: 0, duration: 0.45, ease: "back.out(2)" }, 45.2);
        tl.from(q(".sl-part.st"), { scale: 0.8, opacity: 0, duration: 0.45, ease: "back.out(2)" }, 46.0);
        tl.to(q("#slab"), { boxShadow: "0 0 60px rgba(245,166,35,0.35), inset 0 1px 0 rgba(255,255,255,0.12)", borderColor: "#f5a623", duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 47.6);

        tl.to({}, { duration: DURATION }, 0); // Law #11 anchor
        window.__timelines = window.__timelines || {};
        /*WARP-BEGIN*/ // generated by scripts/voice_sync.py: plays the scripted timeline in step with the recorded voice
        const WARP = [[0.0, 0.0], [0.6, 0.6], [6.76, 6.1], [15.76, 15.07], [29.3, 24.94], [29.36, 25.7], [33.04, 30.83], [34.12, 31.67], [40.9, 40.24], [43.04, 41.03], [53.28, 50.03], [54.6, 52.0]]; // [real, scripted] chapter-local seconds
        const voiced = gsap.timeline({ paused: true });
        for (let i = 0; i < WARP.length - 1; i++) {
          const [r0, s0] = WARP[i], [r1, s1] = WARP[i + 1];
          voiced.fromTo(tl, { time: s0 }, { time: s1, duration: r1 - r0, ease: "none", immediateRender: false }, r0);
        }
        voiced.to({}, { duration: 54.6 }, 0); // Law #11 anchor (recorded length)
        window.__timelines["ch5"] = voiced; /*WARP-END*/
      })();
    </script>
