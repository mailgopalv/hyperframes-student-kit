<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Agent with Sub-Agents — Google ADK</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #07121c; font-family: "Montserrat", sans-serif; color: #ffffff;
      }
      .whip {
        position: absolute; top: 50%; left: 0; width: 46%; height: 10px;
        background: linear-gradient(90deg, transparent, #ffffff, transparent);
        filter: blur(8px); transform: translateY(-50%); opacity: 0; z-index: 100;
      }
    </style>
  </head>
  <body>
    <!-- Chapter slots come from scripts/cues.py (narration timing). Total 847.467s = 14:07. -->
    <div data-hf-id="hf-gskp" id="root" data-composition-id="multi-agents" data-start="0" data-width="1920" data-height="1080">

      <!-- Grid / crosshairs / particles / grain / vignette under every chapter -->
      <div data-hf-id="hf-5rid" id="ambient-bg" data-composition-id="ambient-bg" data-composition-src="compositions/ambient-bg.html" data-start="0" data-duration="847.467" data-track-index="0"></div>

      <!-- Chapters, sequential on one track -->
      <div data-hf-id="hf-nbid" id="c-ch0" data-composition-id="ch0" data-composition-src="compositions/ch0-title.html" data-start="0" data-duration="35.26" data-track-index="1"></div>
      <div data-hf-id="hf-p9gq" id="c-ch1" data-composition-id="ch1" data-composition-src="compositions/ch1-agent.html" data-start="35.26" data-duration="48.92" data-track-index="1"></div>
      <div data-hf-id="hf-kxpl" id="c-ch2" data-composition-id="ch2" data-composition-src="compositions/ch2-session.html" data-start="84.18" data-duration="64.49" data-track-index="1"></div>
      <div data-hf-id="hf-kyh2" id="c-ch3" data-composition-id="ch3" data-composition-src="compositions/ch3-problem.html" data-start="148.67" data-duration="34.4" data-track-index="1"></div>
      <!-- ch3 → ch4 is a match cut (same box, same layout): no whip -->
      <div data-hf-id="hf-r5lv" id="c-ch4" data-composition-id="ch4" data-composition-src="compositions/ch4-subagents.html" data-start="183.07" data-duration="66.605" data-track-index="1"></div>
      <div data-hf-id="hf-27pn" id="c-ch5" data-composition-id="ch5" data-composition-src="compositions/ch5-control.html" data-start="249.675" data-duration="54.6" data-track-index="1"></div>
      <div data-hf-id="hf-t1el" id="c-ch6" data-composition-id="ch6" data-composition-src="compositions/ch6-journey.html" data-start="304.275" data-duration="104.382" data-track-index="1"></div>
      <div data-hf-id="hf-g2m3" id="c-ch7" data-composition-id="ch7" data-composition-src="compositions/ch7-code.html" data-start="408.657" data-duration="383.36" data-track-index="1"></div>
      <div data-hf-id="hf-tak7" id="c-ch8" data-composition-id="ch8" data-composition-src="compositions/ch8-recap.html" data-start="792.017" data-duration="55.45" data-track-index="1"></div>


      <!-- Voiceover -->
      <audio id="vo-1" src="assets/Part1.m4a" data-start="1.17" data-duration="248.305" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-2" src="assets/Part2.m4a" data-start="250.245" data-duration="158.212" data-track-index="11" data-volume="1"></audio>
      <audio id="vo-3" src="assets/Part3.m4a" data-start="409.237" data-duration="381.577" data-track-index="12" data-volume="1"></audio>
      <audio id="vo-4" src="assets/Part4.m4a" data-start="792.587" data-duration="47.745" data-track-index="13" data-volume="1"></audio>
      <!-- /Voiceover -->

      <!-- Whip-streaks over every chapter seam (Law #5) -->
      <div id="whip-0" class="whip clip" data-start="35.06" data-duration="0.4" data-track-index="2"></div>
      <div id="whip-1" class="whip clip" data-start="83.98" data-duration="0.4" data-track-index="2"></div>
      <div id="whip-2" class="whip clip" data-start="148.47" data-duration="0.4" data-track-index="2"></div>
      <div id="whip-3" class="whip clip" data-start="249.48" data-duration="0.4" data-track-index="2"></div>
      <div id="whip-4" class="whip clip" data-start="304.07" data-duration="0.4" data-track-index="2"></div>
      <div id="whip-5" class="whip clip" data-start="408.46" data-duration="0.4" data-track-index="2"></div>
      <div id="whip-6" class="whip clip" data-start="791.82" data-duration="0.4" data-track-index="2"></div>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        document.querySelectorAll(".whip").forEach(function (el) {
          const start = parseFloat(el.getAttribute("data-start"));
          tl.fromTo(el,
            { opacity: 0, xPercent: -100, scaleX: 0.5 },
            { opacity: 1, xPercent: 250, scaleX: 1.5, duration: 0.4, ease: "power3.in" },
            start);
          tl.set(el, { opacity: 0 }, start + 0.4);
        });
        tl.set({}, {}, 847.467);
        window.__timelines = window.__timelines || {};
        window.__timelines["multi-agents"] = tl;
      })();
    </script>
  </body>
</html>
