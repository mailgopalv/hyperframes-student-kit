      [data-composition-id="ch7"] .note.amber b { color: #f5a623; }

      [data-composition-id="ch7"] .term { display: flex; gap: 30px; padding: 40px 40px; }
      [data-composition-id="ch7"] .t-left { flex: 1.25; display: flex; flex-direction: column; gap: 20px; }
      [data-composition-id="ch7"] .t-l { font-family: "JetBrains Mono", monospace; font-size: 22px; color: #ffffff; white-space: nowrap; }
      [data-composition-id="ch7"] .t-l .pr { color: #37bdf8; font-weight: 700; }
      [data-composition-id="ch7"] .t-l .ve { display: inline-block; color: #f5a623; font-weight: 700; }
      [data-composition-id="ch7"] .t-l .os { margin-left: 12px; font-family: "Montserrat", sans-serif; font-size: 18px; font-weight: 700; color: #07121c; background: #8fa2b8; border-radius: 6px; padding: 2px 10px; }
      [data-composition-id="ch7"] .t-l.alt { color: #b9c6d4; }
      [data-composition-id="ch7"] .t-l.dim { color: #8fa2b8; padding-left: 20px; }
      [data-composition-id="ch7"] .t-right { position: relative; flex: 1; }
      [data-composition-id="ch7"] .pane { position: absolute; inset: 0; border-radius: 14px; padding: 22px 26px; background: rgba(55,189,248,0.06); border: 1.5px solid rgba(55,189,248,0.5); opacity: 0; box-sizing: border-box; }
      [data-composition-id="ch7"] .pane.st { background: rgba(245,166,35,0.06); border-color: #f5a623; box-shadow: 0 0 40px rgba(245,166,35,0.2); }
      [data-composition-id="ch7"] .p-h { font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; color: #37bdf8; margin-bottom: 16px; }
      [data-composition-id="ch7"] .pane.st .p-h { color: #f5a623; }
      [data-composition-id="ch7"] .pane .mono { font-size: 21px; line-height: 38px; }
      [data-composition-id="ch7"] .p-note { margin-top: 20px; font-size: 22px; color: #b9c6d4; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const S = '[data-composition-id="ch7"] ';
        const q = (sel) => document.querySelector(S + sel);
        const qa = (sel) => Array.from(document.querySelectorAll(S + sel));
        const DURATION = __DURATION__;
        const C = __CUES__;          // narration cue number → chapter-local start (from scripts/cues.json)
        const LH = __LH__, VIS = 24, ROW = 44;
        const tl = gsap.timeline({ paused: true });

        // ---------- explorer rows (absolutely placed, so rows can be inserted later) ----------
        const order0 = ["r-code", "r-pkg", "r-init", "r-agent", "r-cart", "r-cat", "r-data", "r-ord", "r-envx", "r-git", "r-readme", "r-req"];
        order0.forEach((id, i) => gsap.set(q("#" + id), { y: i * ROW }));
        gsap.set([q("#r-venv"), q("#r-env")], { opacity: 0 });
        const moveRows = (list, t, skip) => list.forEach((id, i) => { if (id !== skip) tl.to(q("#" + id), { y: i * ROW, duration: 0.5, ease: "power2.inOut" }, t); });
        let order = order0.slice();
        const selectRow = (id, t) => tl.to(q("#sel"), { opacity: 1, y: order.indexOf(id) * ROW, duration: 0.45, ease: "power3.inOut" }, t);

        // ---------- editor views ----------
        let cur = null, curTab = null;
        const show = (vid, tab, t) => {
          if (cur === vid) return;
          if (cur) {
            tl.to(q("#v-" + cur), { opacity: 0, x: -60, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, t);
            tl.to(q("#tab-" + curTab), { opacity: 0, duration: 0.2, ease: "none" }, t);
          }
          tl.fromTo(q("#v-" + vid), { opacity: 0, x: 80, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, t + 0.25);
          tl.fromTo(q("#tab-" + tab), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t + 0.3);
          cur = vid; curTab = tab;
        };
        const openFile = (vid, row, t) => {
          show(vid, vid, t); selectRow(row, t);
          tl.fromTo(q("#" + row), { color: "#b9c6d4" }, { color: "#ffffff", duration: 0.3, ease: "none" }, t + 0.2);
        };

        // ---------- code: scroll + highlight bands ----------
        const scrollPos = {};
        const scrollTo = (vid, a, b, t) => {
          const n = +q("#v-" + vid).dataset.n;
          const top = Math.round((a + b) / 2 - VIS / 2);
          const s = Math.max(0, Math.min(top - 1, n - VIS)) * LH;
          if ((scrollPos[vid] || 0) === s) return;
          tl.to(q("#sc-" + vid), { y: -s, duration: 0.8, ease: "power2.inOut" }, t);
          scrollPos[vid] = s;
        };
        const hl = (vid, kind, a, b, t, dur) => {
          scrollTo(vid, a, b, t - 0.15);
          const el = q("#b" + kind + "-" + vid);
          tl.set(el, { y: (a - 1) * LH, scaleY: b - a + 1 }, t);
          tl.fromTo(el, { opacity: 0, scaleX: 0.97 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" }, t);
          tl.to(el, { opacity: 0, duration: 0.3, ease: "power2.in" }, t + dur);
        };
        const lineOf = (vid, n) => "#v-" + vid + " .ln:nth-child(" + (n + 2) + ") .tx"; // 2 bands precede the lines
        const glow = (sel, color, t, reps) => tl.fromTo(q(sel), { textShadow: "0 0 0px rgba(0,0,0,0)" }, { textShadow: "0 0 18px " + color, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: reps || 3 }, t);
        const note = (id, t0, t1) => {
          tl.fromTo(q(id), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, t0);
          tl.to(q(id), { opacity: 0, y: 20, duration: 0.3, ease: "power2.in" }, t1);
        };
        const heading = (from, to, t) => {
          tl.to(q(from), { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.35, ease: "power2.in" }, t);
          tl.fromTo(q(to), { opacity: 0, y: 40, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, t + 0.35);
        };
        const pop = (sel, t) => tl.fromTo(q(sel), { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, t);
        const AMBER = "rgba(245,166,35,1)";

        // ===== 1 — the repo is in the description =====
        tl.from(q("#kicker"), { x: -60, opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "expo.out" }, 0.3);
        tl.from(q("#h-code"), { y: 50, opacity: 0, filter: "blur(16px)", duration: 0.8, ease: "expo.out" }, 0.5);
        tl.from(q("#ed"), { y: 60, opacity: 0, filter: "blur(12px)", duration: 0.8, ease: "power3.out" }, 1.2);
        show("repo", "repo", 1.4);
        tl.from(q(".repo-ic"), { scale: 0.3, opacity: 0, rotation: -40, duration: 0.7, ease: "back.out(2)" }, 2.0);
        ["#ck1", "#ck2", "#ck3"].forEach((id, i) => pop(id, C[1] + 6.5 + i * 1.3));

        // ===== 2 — one folder, one file per agent =====
        tl.from(q("#side"), { x: -100, opacity: 0, filter: "blur(10px)", duration: 0.7, ease: "expo.out" }, C[2]);
        tl.from(order0.map((id) => q("#" + id)), { x: -24, opacity: 0, duration: 0.3, ease: "power2.out", stagger: 0.06 }, C[2] + 0.3);
        show("ov", "ov", C[2] + 0.4);
        tl.from(qa("#v-ov .o-row"), { x: 50, opacity: 0, duration: 0.4, ease: "power3.out", stagger: 0.45 }, C[2] + 1.0);

        // ===== 3–6 — agent.py: imports, MODEL, the tool, the tool_context parameter =====
        openFile("agent", "r-agent", C[3]);
        hl("agent", "b", 5, 6, C[3] + 3.4, 3.4);
        hl("agent", "b", 8, 10, C[3] + 7.4, 4.3);
        hl("agent", "b", 12, 12, C[4] + 0.3, 7.0);
        hl("agent", "b", 15, 16, C[5] + 0.3, 5.4);
        hl("agent", "a", 17, 17, C[5] + 6.1, 5.4);
        hl("agent", "a", 16, 16, C[6] + 0.3, 7.4);
        tl.fromTo(q("#v-agent .tok-tc"), { scale: 1 }, { scale: 1.12, duration: 0.35, ease: "back.out(2)", yoyo: true, repeat: 3 }, C[6] + 1.6);
        glow("#v-agent .tok-tc", AMBER, C[6] + 1.6, 7);

        // ===== 7–11 — ToolContext =====
        heading("#h-code", "#h-tc", C[7]);
        show("tc1", "tc", C[7]);
        tl.from(q("#tc1-l"), { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, C[7] + 0.4);
        tl.from(q("#tc1-r"), { x: 60, opacity: 0, duration: 0.6, ease: "power3.out" }, C[8] + 0.3);
        tl.fromTo(q("#tc1-hl"), { scale: 1 }, { scale: 1.06, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, C[8] + 2.6);
        glow("#tc1-hl", AMBER, C[8] + 2.6, 5);

        show("tc2", "tc", C[9]);
        ["#fl1", "#fa1", "#fl2", "#fa2", "#fl3", "#fa3", "#fl4"].forEach((id, i) => tl.from(q(id), { y: 40, opacity: 0, scale: 0.85, duration: 0.45, ease: "back.out(1.7)" }, C[9] + 0.5 + i * 0.55));
        tl.to(q("#fl2"), { borderColor: "#ffffff", boxShadow: "0 0 40px rgba(255,255,255,0.4)", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, C[9] + 2.3);
        pop("#fl-code", C[9] + 5.2);

        show("tc3", "tc", C[10]);
        pop("#rw1", C[10] + 0.8);
        pop("#rw2", C[10] + 4.2);
        pop("#delta", C[10] + 8.6);

        show("tc4", "tc", C[11]);
        tl.from(q("#tc4-l"), { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, C[11] + 0.5);
        tl.from(qa("#tc4-l .chips span"), { scale: 0.5, opacity: 0, duration: 0.3, ease: "back.out(2)", stagger: 0.12 }, C[11] + 1.5);
        tl.from(q("#tc4-r"), { x: 60, opacity: 0, duration: 0.6, ease: "power3.out" }, C[11] + 3.2);
        pop("#extras", C[11] + 9.4);

        // ===== 12–15 — back to agent.py: the writes, root_agent, instruction, sub_agents =====
        heading("#h-tc", "#h-code", C[12]);
        show("agent", "agent", C[12]);
        hl("agent", "a", 18, 20, C[12] + 1.2, 6.0);
        hl("agent", "b", 21, 21, C[12] + 7.6, 2.4);
        hl("agent", "b", 24, 27, C[13] + 0.4, 11.8);
        hl("agent", "a", 28, 34, C[14] + 0.3, 8.4);
        hl("agent", "b", 35, 35, C[15] + 0.3, 3.4);
        hl("agent", "a", 36, 36, C[15] + 4.2, 8.3);
        glow(lineOf("agent", 36), AMBER, C[15] + 4.6, 5);

        // ===== 16 — data.py, then catalog_agent.py imports =====
        openFile("data", "r-data", C[16] + 0.2);
        hl("data", "b", 3, 9, C[16] + 4.4, 2.2);
        openFile("cat", "r-cat", C[16] + 7.2);
        hl("cat", "b", 8, 8, C[16] + 8.2, 3.0);

        // ===== 17–20 — list_products, add_to_cart, write it back, the instruction =====
        hl("cat", "b", 13, 15, C[17] + 0.3, 6.8);
        note("#n1", C[17] + 1.6, C[18] - 0.3);
        hl("cat", "b", 20, 21, C[18] + 2.2, 2.4);
        hl("cat", "a", 23, 23, C[18] + 4.8, 1.7);
        hl("cat", "b", 24, 24, C[18] + 6.8, 1.5);
        hl("cat", "a", 25, 25, C[18] + 8.8, 13.6);
        note("#n2", C[19] + 1.4, C[20] - 0.3);
        glow(lineOf("cat", 25), AMBER, C[19] + 1.0, 7);
        hl("cat", "b", 34, 34, C[20] + 1.2, 4.6);
        glow("#v-cat .ph", AMBER, C[20] + 1.5, 3);
        hl("cat", "b", 37, 37, C[20] + 6.6, 5.4);

        // ===== 21–24 — cart_agent.py =====
        openFile("cart", "r-cart", C[21] + 0.2);
        hl("cart", "b", 8, 8, C[21] + 1.6, 6.0);
        hl("cart", "b", 14, 23, C[22] + 0.3, 5.0);
        hl("cart", "a", 26, 34, C[22] + 5.6, 4.6);
        hl("cart", "a", 43, 44, C[23] + 0.5, 6.4);
        hl("cart", "b", 56, 57, C[24] + 0.5, 10.2);

        // ===== 25–27 — order_agent.py =====
        openFile("ord", "r-ord", C[25] + 0.2);
        hl("ord", "a", 16, 17, C[25] + 1.4, 8.1);
        hl("ord", "a", 20, 22, C[26] + 0.3, 7.5);
        hl("ord", "a", 36, 38, C[27] + 0.3, 12.2);
        tl.fromTo(qa("#v-ord .ph"), { textShadow: "0 0 0px rgba(0,0,0,0)" }, { textShadow: "0 0 18px " + AMBER, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.15 }, C[27] + 1.2);
        tl.fromTo(qa("#v-ord .ph .q"), { scale: 1 }, { scale: 1.8, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 3, stagger: 0.1 }, C[27] + 7.6);

        // ===== 28 — __init__.py, then root_agent =====
        openFile("init", "r-init", C[28] + 0.2);
        hl("init", "b", 1, 1, C[28] + 1.0, 3.6);
        openFile("agent", "r-agent", C[28] + 5.0);
        hl("agent", "b", 24, 24, C[28] + 5.8, 4.2);
        tl.fromTo(q("#v-agent .tok-ra"), { scale: 1 }, { scale: 1.15, duration: 0.35, ease: "back.out(2)", yoyo: true, repeat: 3 }, C[28] + 6.2);

        // ===== 29 — virtual environment =====
        heading("#h-code", "#h-setup", C[29]);
        tl.to(q("#sel"), { opacity: 0, duration: 0.3, ease: "power2.in" }, C[29]);
        show("venv", "venv", C[29]);
        tl.from(q("#ve-l"), { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, C[29] + 2.0);
        tl.from(q("#ve-r"), { x: 60, opacity: 0, duration: 0.6, ease: "power3.out" }, C[29] + 4.2);
        tl.from(qa("#ve-r .chips span"), { scale: 0.5, opacity: 0, duration: 0.3, ease: "back.out(2)", stagger: 0.15 }, C[29] + 4.8);
        tl.fromTo(qa("#ve-l .chips span")[2], { borderColor: "rgba(143,162,184,0.45)" }, { borderColor: "#e10b1f", duration: 0.3, ease: "power2.out", yoyo: true, repeat: 3 }, C[29] + 7.5);
        pop("#ve-note", C[29] + 9.5);

        // ===== 30–34 — terminal =====
        show("term", "term", C[30]);
        qa("#v-term .t-l").forEach((el) => gsap.set(el, { opacity: 0 }));
        const line = (id, t) => tl.fromTo(q(id), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, t);
        line("#t1", C[30] + 0.8);
        // .venv/ appears in the explorer
        order = ["r-code", "r-venv", "r-pkg", "r-init", "r-agent", "r-cart", "r-cat", "r-data", "r-ord", "r-envx", "r-git", "r-readme", "r-req"];
        tl.set(q("#r-venv"), { y: ROW }, C[30] + 2.4);
        moveRows(order, C[30] + 2.4, "r-venv");
        tl.fromTo(q("#r-venv"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, C[30] + 2.7);
        selectRow("r-venv", C[30] + 2.9);
        line("#t2", C[31] + 1.0);
        line("#t3", C[31] + 4.2);
        line("#t4", C[31] + 7.4);
        glow("#t4 .ve", AMBER, C[31] + 7.8, 3);
        tl.fromTo(q("#p-req"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, C[32] + 0.6);
        selectRow("r-req", C[32] + 0.6);
        line("#t5", C[32] + 3.4);
        tl.to(q("#p-req"), { opacity: 0, duration: 0.3, ease: "power2.in" }, C[33]);
        line("#t6", C[33] + 0.8);
        // .env appears above .env.example
        order = ["r-code", "r-venv", "r-pkg", "r-init", "r-agent", "r-cart", "r-cat", "r-data", "r-ord", "r-env", "r-envx", "r-git", "r-readme", "r-req"];
        tl.set(q("#r-env"), { y: 9 * ROW }, C[33] + 1.8);
        moveRows(order, C[33] + 1.8, "r-env");
        tl.fromTo(q("#r-env"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, C[33] + 2.1);
        selectRow("r-env", C[33] + 2.3);
        tl.fromTo(q("#p-env"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, C[33] + 2.6);
        tl.to(q("#p-env"), { opacity: 0, duration: 0.3, ease: "power2.in" }, C[34]);
        tl.to(q("#sel"), { opacity: 0, duration: 0.3, ease: "power2.in" }, C[34]);
        line("#t7", C[34] + 0.6);
        line("#t8", C[34] + 1.8);
        tl.fromTo(q("#p-state"), { opacity: 0, x: 40, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, C[34] + 4.4);
        tl.to(q("#p-state"), { boxShadow: "0 0 70px rgba(245,166,35,0.45)", duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, C[34] + 7.0);

        tl.to({}, { duration: DURATION }, 0); // Law #11 anchor
        window.__timelines = window.__timelines || {};
        window.__timelines["ch7"] = tl;
      })();
    </script>
  </div>
</template>
