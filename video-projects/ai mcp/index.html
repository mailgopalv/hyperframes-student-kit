<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>AI MCP Shorts — Vertical</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&family=Roboto+Mono:wght@400;500;700&display=block" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #07121c;
        font-family: "Montserrat", sans-serif;
        color: #ffffff;
      }
      /* Source video is already native 1080x1920 (matches canvas exactly),
         unlike a landscape source — no BOTTOM/FULLSCREEN crop transform is
         needed. The wrapper always fills the canvas 1:1; panel scenes create
         the "bottom-half visible" look simply by drawing an opaque top-900px
         panel ABOVE the face in z-index, not by moving/cropping the video. */
      #face-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 0;
      }
      #face-video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: contrast(1.08) saturate(1.08) brightness(0.97);
      }
      #face-wrapper::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 60%,
          rgba(7, 18, 28, 0.3) 88%,
          rgba(7, 18, 28, 0.6) 100%
        );
      }
      .scene-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-focj" id="root" data-composition-id="main" data-start="0" data-duration="72.57" data-width="1080" data-height="1920">
      <!-- Ambient background — radial gradient + drifting grid + particles + vignette. -->
      <div data-hf-id="hf-led0" id="ambient-bg" class="scene-layer" data-composition-id="ambient-bg" data-composition-src="compositions/ambient-bg.html" data-start="0" data-duration="72.57" data-track-index="3" data-width="1080" data-height="1920"></div>

      <!-- Face video. Native 1080x1920 — fills the canvas exactly, no transform choreography. -->
      <div data-hf-id="hf-w3eg" id="face-wrapper">
        <video data-hf-id="hf-afr2" id="face-video" data-start="0" data-duration="72.57" data-track-index="0" src="assets/ai-mcp-shorts-edit-clean.mp4" muted playsinline></video>
      </div>

      <!-- Seam treatment — feathers the y=900 edge where panel scenes (Stage 1-3,
           Breakthrough) sit above the face. -->
      <div data-hf-id="hf-nis1" id="seam-treatment" class="scene-layer" data-composition-id="seam-treatment" data-composition-src="compositions/seam-treatment.html" data-start="0" data-duration="72.57" data-track-index="5" data-width="1080" data-height="1920"></div>

      <!-- Audio (separate track for the mixer) -->
      <audio data-hf-id="hf-6f9y" id="face-audio" data-start="0" data-duration="72.57" data-track-index="4" data-volume="1" src="assets/ai-mcp-shorts-edit-clean.mp4"></audio>

      <!-- Scene overlays — back-to-back on the real transcript's stage boundaries. -->
      <div data-hf-id="hf-vu7l" id="scene-1" class="scene-layer" data-composition-id="scene1-hook" data-composition-src="compositions/scene1-hook.html" data-start="0" data-duration="10.90" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-7aaf" id="scene-2" class="scene-layer" data-composition-id="scene2-stage1" data-composition-src="compositions/scene2-stage1.html" data-start="10.90" data-duration="10.60" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-nxat" id="scene-3" class="scene-layer" data-composition-id="scene3-stage2" data-composition-src="compositions/scene3-stage2.html" data-start="21.50" data-duration="13.84" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-7h8r" id="scene-4" class="scene-layer" data-composition-id="scene4-stage3" data-composition-src="compositions/scene4-stage3.html" data-start="35.34" data-duration="13.86" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-d7bn" id="scene-5" class="scene-layer" data-composition-id="scene5-breakthrough" data-composition-src="compositions/scene5-breakthrough.html" data-start="49.20" data-duration="16.22" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-4s78" id="scene-6" class="scene-layer" data-composition-id="scene6-outro" data-composition-src="compositions/scene6-outro.html" data-start="65.42" data-duration="7.15" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- Captions -->
      <div data-hf-id="hf-119e" id="captions" class="scene-layer" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="72.57" data-track-index="2" data-width="1080" data-height="1920"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      gsap.set("#face-video", { x: -12, y: 185 });
      const mainTl = gsap.timeline({ paused: true });
      mainTl.set("#face-wrapper", { x: -11, y: 257, data: "hf-hold" }, 0);
      const DUR = 72.57;

      // Ken Burns — subtle zoom over the full duration keeps the face from
      // reading as a still cutout (required per short-form skill, no exceptions).
      mainTl.to("#face-video", { scale: 1.025, duration: DUR, ease: "none" }, 0);

      // Fullscreen beats (hook 0-10.90, outro 65.42-end) push the video down
      // so there's clear headroom above the head for the overlay text/icons —
      // without this the headline sat right at the hairline. Panel beats
      // (10.90-65.42) stay at native position: the panel already covers the
      // top of frame, and native gave the best face crop there.
      const FACE_DOWN = 160;

      mainTl.set({}, {}, DUR);
      mainTl.to("#face-wrapper", { keyframes: {
            "0%": { x: -11, y: 257 },
            "95.4%": { y: 160, x: 0 },
            "100%": { y: 0, x: -11 }
      }, duration: 8.659 }, 2.291);
      window.__timelines["main"] = mainTl;
    </script>
  </body>
</html>
