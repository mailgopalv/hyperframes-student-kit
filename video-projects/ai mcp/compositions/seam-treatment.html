<template id="seam-treatment-template">
  <div data-hf-id="hf-mhjz" data-composition-id="seam-treatment" data-start="0" data-width="1080" data-height="1920" data-duration="72.57">
    <!-- Feathers the y=900 edge between the opaque graphics panel (stages 1-3 +
         breakthrough) and the face below it. Panel scenes are back-to-back with
         no gaps (10.90 -> 65.42), so this is a single visible window, unlike
         may-shorts-19's multiple disjoint windows. -->
    <div data-hf-id="hf-ttz8" class="seam-gradient" id="seam-gradient"></div>
    <div data-hf-id="hf-tics" class="seam-line" id="seam-line"></div>

    <style>
      [data-composition-id="seam-treatment"] {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      [data-composition-id="seam-treatment"] .seam-gradient {
        position: absolute;
        left: 0;
        right: 0;
        top: 680px;
        height: 80px;
        background: linear-gradient(
          to bottom,
          rgba(7, 18, 28, 0.85) 0%,
          rgba(7, 18, 28, 0.4) 35%,
          rgba(7, 18, 28, 0) 100%
        );
        opacity: 0;
      }
      [data-composition-id="seam-treatment"] .seam-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 678px;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(55, 189, 248, 0.35) 20%,
          rgba(55, 189, 248, 0.9) 50%,
          rgba(55, 189, 248, 0.35) 80%,
          transparent 100%
        );
        box-shadow: 0 0 18px rgba(55, 189, 248, 0.55);
        opacity: 0;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="seam-treatment"] ';
        const FADE = 0.25;

        const WIN_START = 10.90;
        const WIN_END = 65.42;

        const els = [scope + "#seam-gradient", scope + "#seam-line"];

        els.forEach(function (sel) {
          tl.set(sel, { opacity: 0 }, 0);
        });

        const inAt = Math.max(WIN_START - 0.1, 0);
        const outAt = Math.max(WIN_END - FADE - 0.05, inAt + 0.1);
        els.forEach(function (sel, i) {
          const target = i === 0 ? 1.0 : 0.8;
          tl.to(sel, { opacity: target, duration: FADE, ease: "power2.out" }, inAt);
          tl.to(sel, { opacity: 0, duration: FADE, ease: "power2.in" }, outAt);
        });

        tl.set({}, {}, 72.57);

        window.__timelines = window.__timelines || {};
        window.__timelines["seam-treatment"] = tl;
      })();
    </script>
  </div>
</template>
