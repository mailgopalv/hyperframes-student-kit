<template id="scene1-hook-template">
  <div data-hf-id="hf-q1os" data-composition-id="scene1-hook" data-start="0" data-width="1080" data-height="1920" data-duration="10.90">
    <!-- Fullscreen face beat — no opaque panel. Small corner icon + kinetic
         headline float over the live camera. Hero frame ~t=2s: icon settled,
         both headline lines fully landed, well clear of the caption zone
         (captions live at bottom:220px). -->
    <div data-hf-id="hf-4mfn" class="s1-icon-chip" id="s1-icon">
      <svg data-hf-id="hf-6ljx" viewBox="0 0 48 48" fill="none">
        <circle data-hf-id="hf-xlh0" cx="24" cy="24" r="22" fill="none" stroke="#37bdf8" stroke-width="2.5" opacity="0.5" />
        <path data-hf-id="hf-505u" d="M16 15c1 3 2.4 5.6 4.4 7.6 2 2 4.6 3.4 7.6 4.4l3-3c.5-.5 1.3-.6 1.9-.3 2 1 4.2 1.6 6.5 1.7 1 0 1.8.8 1.8 1.8v5.6c0 1-.8 1.8-1.8 1.8C25.7 34.6 13.4 22.3 13.4 8.6c0-1 .8-1.8 1.8-1.8H20.8c1 0 1.8.8 1.8 1.8.1 2.3.7 4.5 1.7 6.5.3.6.2 1.4-.3 1.9l-3 3" fill="none" stroke="#37bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div data-hf-id="hf-kzd0" class="s1-headline" id="s1-headline">
      <div data-hf-id="hf-q92z" class="s1-line" id="s1-l1"><span data-hf-id="hf-dks7" class="s1-word">3</span> <span data-hf-id="hf-gs19" class="s1-word">STEPS</span> <span data-hf-id="hf-omyr" class="s1-word">TO</span></div>
      <div data-hf-id="hf-fdlc" class="s1-line" id="s1-l2"><span data-hf-id="hf-vyt4" class="s1-word">NEXT-GEN</span> <span data-hf-id="hf-byuk" class="s1-word">AI</span></div>
    </div>

    <style>
      [data-composition-id="scene1-hook"] {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      [data-composition-id="scene1-hook"] .s1-icon-chip {
        position: absolute;
        top: 110px;
        left: 60px;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: rgba(7, 18, 28, 0.55);
        border: 1.5px solid rgba(55, 189, 248, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 26px rgba(55, 189, 248, 0.35);
        opacity: 0;
        transform: scale(0.6) translateY(-14px);
      }
      [data-composition-id="scene1-hook"] .s1-icon-chip svg {
        width: 48px;
        height: 48px;
      }
      [data-composition-id="scene1-hook"] .s1-headline {
        position: absolute;
        top: 250px;
        left: 0;
        right: 0;
        padding: 0 70px;
        text-align: center;
        font-family: "Montserrat", sans-serif;
        font-weight: 900;
        font-size: 78px;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      [data-composition-id="scene1-hook"] .s1-line {
        opacity: 1;
      }
      [data-composition-id="scene1-hook"] .s1-word {
        display: inline-block;
        /* Solid white + layered navy stroke (same technique as captions.html)
           instead of chrome-gradient-on-transparent — chrome gradient assumes
           a black canvas per house style, but this text sits directly over
           live, unpredictable video (a light wall reads white-on-gray as
           nearly invisible). The stroke guarantees contrast over ANY
           background; the teal layer keeps it on-brand. */
        color: #ffffff;
        text-shadow:
          -3px -3px 0 #07121c, 3px -3px 0 #07121c,
          -3px 3px 0 #07121c, 3px 3px 0 #07121c,
          -4px 0 0 #07121c, 4px 0 0 #07121c,
          0 -4px 0 #07121c, 0 4px 0 #07121c,
          0 0 26px rgba(55, 189, 248, 0.45),
          0 10px 24px rgba(0, 0, 0, 0.65);
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene1-hook"] ';
        const DUR = 10.90;

        // Icon bounces in first.
        tl.to(scope + "#s1-icon", { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.2)" }, 0.2);

        // Kinetic word-by-word reveal — 5 words, staggered.
        const words = gsap.utils.toArray(scope + ".s1-word");
        words.forEach(function (w, i) {
          tl.to(w, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: i % 2 === 0 ? "power3.out" : "expo.out" }, 0.6 + i * 0.22);
        });

        // Idle: icon gentle bob loop for the rest of the (long) scene.
        const iconStart = 1.1;
        const bobCycle = 1.6;
        const bobCycles = Math.max(Math.floor((DUR - iconStart) / bobCycle) - 1, 1);
        tl.to(scope + "#s1-icon", { y: -8, duration: bobCycle / 2, ease: "sine.inOut", yoyo: true, repeat: bobCycles * 2 - 1 }, iconStart);

        // Idle: subtle scale breathe so the long hold isn't static. (Not
        // textShadow — that would overwrite the contrast stroke above.)
        const haloStart = 1.9;
        const haloCycle = 2.4;
        const haloCycles = Math.max(Math.floor((DUR - haloStart) / haloCycle) - 1, 1);
        words.forEach(function (w, i) {
          tl.to(w, {
            scale: 1.03,
            duration: haloCycle / 2,
            ease: "sine.inOut",
            yoyo: true,
            repeat: haloCycles * 2 - 1,
          }, haloStart + i * 0.05);
        });

        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-hook"] = tl;
      })();
    </script>
  </div>
</template>
