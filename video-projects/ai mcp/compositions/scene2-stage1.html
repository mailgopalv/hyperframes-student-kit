    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene2-stage1"] ';
        const DUR = 10.60;

        // Scan sweep sells the transition into this scene.
        tl.fromTo(scope + "#s2-scan", { x: "-100%" }, { x: "100%", duration: 0.5, ease: "power2.inOut" }, 0);
        tl.to(scope + "#s2-badge", { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.15);

        // Nodes land staggered, then arrows draw in between them.
        tl.to(scope + "#s2-n1", { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.3)" }, 0.4);
        tl.to(scope + "#s2-a1 line", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.85);
        tl.to(scope + "#s2-a1 path", { opacity: 1, duration: 0.15 }, 1.2);
        tl.to(scope + "#s2-n2", { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 1.05);
        tl.to(scope + "#s2-a2 line", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.5);
        tl.to(scope + "#s2-a2 path", { opacity: 1, duration: 0.15 }, 1.85);
        tl.to(scope + "#s2-n3", { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 1.7);

        // Idle: pulse dots travel node-to-node continuously, selling "manual,
        // one-at-a-time" flow while the speaker explains the stage.
        const pulseStart = 2.3;
        const pulseCycle = 1.3;
        const pulseCycles = Math.max(Math.floor((8.4 - pulseStart) / pulseCycle) - 1, 1);
        ["#s2-a1", "#s2-a2"].forEach(function (sel, i) {
          const dot = scope + sel + " .s2-pulse-dot";
          tl.set(dot, { opacity: 1 }, pulseStart);
          tl.fromTo(dot, { x: 0 }, { x: 76, duration: pulseCycle, ease: "power1.inOut", repeat: pulseCycles - 1 }, pulseStart + i * 0.15);
        });

        // "unscalable." local 19.59-10.90=8.69 -> 20.48-10.90=9.58. Tag stamps
        // in right on the word, holds for the remainder of the scene (no exit
        // tween — this is not the final scene).

        tl.to(scope + "#s2-tag", { scale: 1.06, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 8.95);

        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene2-stage1"] = tl;
